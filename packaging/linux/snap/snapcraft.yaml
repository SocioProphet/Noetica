# Snap for the Noetica DESKTOP app (not the old headless agent-machine daemon).
#
# Confinement is `classic` deliberately: Noetica bundles sidecars (agent-machine, ollama,
# noetica-embed, noetica-operator) and provisions a model runtime into ~/.noetica at first
# boot — downloading and exec'ing binaries at runtime, plus GPU access, is exactly what
# strict confinement blocks. Classic sidesteps that, at the cost of a one-time MANUAL review
# by the Snap Store team (request in https://forum.snapcraft.io → "store-requests") before
# `snapcraft upload` on a classic snap is accepted.
#
# NOT YET BUILD-TESTED — validate locally with `snapcraft --use-lxd` before the first upload.
# The simplest build reuses the .deb the release workflow already produces (see the part).
name: noetica
title: Noetica
base: core22
version: '0.4.24'
summary: Governed, sovereign AI workstation
description: |
  Noetica is a local-first desktop workstation for governed AI. It runs models on your
  own machine, grounds answers in your own knowledge graph, cites its sources, and returns
  "insufficient evidence" instead of guessing — so an answer can be defended, not just
  produced. On-device inference, verified compute, and a sealed provenance receipt on every
  answer.
license: MIT
website: https://socioprophet.ai
source-code: https://github.com/SocioProphet/Noetica
grade: stable
confinement: classic

apps:
  noetica:
    command: bin/noetica
    desktop: usr/share/applications/ai.socioprophet.Noetica.desktop
    common-id: ai.socioprophet.Noetica

parts:
  noetica:
    # Reuse the already-built Linux bundle rather than recompiling the whole Tauri app here:
    # stage the release .deb (the CI job drops it beside this file), which already lays down
    # /usr/bin/noetica + the bundled sidecars + the .desktop + icons.
    plugin: dump
    source: noetica_0.4.24_amd64.deb
    source-type: deb
    organize:
      usr/bin/noetica: bin/noetica
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
      - librsvg2-2
