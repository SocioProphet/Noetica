name: linux-repo

# Publishes a signed apt + dnf repository to the sovereign GCS bucket
# (gs://socioprophet-noetica-apt, served at https://storage.googleapis.com/socioprophet-noetica-apt)
# so users can `apt install noetica` / `dnf install noetica`. Reuses the .deb/.rpm that
# release.yml already builds. Keyless GCP auth via Workload Identity (no SA key); signing via
# the GPG_PRIVATE_KEY secret. STABLE releases only (nightlies stay on the nightly cask).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.4.24"
        required: true

permissions:
  contents: read
  id-token: write        # required for Workload Identity Federation

env:
  BUCKET: socioprophet-noetica-apt
  GPG_FPR: 4913B0E7182A8B62F3B4A11A0166C335A3A87DAA

jobs:
  publish:
    runs-on: ubuntu-latest
    # skip nightlies on the release trigger; workflow_dispatch always runs
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.release.tag_name, 'nightly') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: t
        run: echo "tag=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c gnupg

      - name: Authenticate to GCP (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/400078206872/locations/global/workloadIdentityPools/github-pool/providers/github-socioprophet
          service_account: noetica-apt-publisher@socioprophet-platform.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo -e "${GPG_FPR}:6:" | gpg --import-ownertrust

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p in
          gh release download "${{ steps.t.outputs.tag }}" --repo "${{ github.repository }}" \
            --dir in -p '*.deb' -p '*.rpm'
          echo "downloaded:"; ls -la in

      - name: Sync existing repo (preserve prior versions)
        run: |
          mkdir -p repo/deb/pool/main repo/deb/dists/stable/main/binary-amd64 repo/rpm
          gcloud storage rsync -r "gs://${BUCKET}" repo 2>/dev/null || true

      - name: Assemble packages
        run: |
          cp -f in/*.deb repo/deb/pool/main/ 2>/dev/null || true
          cp -f in/*.rpm repo/rpm/ 2>/dev/null || true

      - name: Build + sign apt metadata
        working-directory: repo/deb
        run: |
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Noetica \
            -o APT::FTPArchive::Release::Label=Noetica \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="Noetica apt repository" \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --default-key "${GPG_FPR}" -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --default-key "${GPG_FPR}" --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Build + sign dnf metadata
        working-directory: repo/rpm
        run: |
          createrepo_c --update .
          rm -f repodata/repomd.xml.asc
          gpg --batch --yes --default-key "${GPG_FPR}" --detach-sign --armor repodata/repomd.xml

      - name: Publish signing key + repo files at bucket root
        run: |
          cp packaging/linux/repo/noetica-archive-keyring.asc repo/
          cp packaging/linux/repo/noetica.repo repo/

      - name: Upload to bucket
        run: |
          # metadata must be short-cached so `apt update` sees new releases quickly; packages are immutable.
          gcloud storage rsync -r repo "gs://${BUCKET}" \
            --cache-control="public,max-age=300"
          echo "Published ${{ steps.t.outputs.tag }} to https://storage.googleapis.com/${BUCKET}/"
