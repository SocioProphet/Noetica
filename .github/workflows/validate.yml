name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: CLI doctor
        run: npm run cli:doctor
      - name: CLI smoke
        run: npm run cli:smoke
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Release artifact
        run: npm run release:artifact
      - name: Inspect release artifact
        run: |
          test -f dist/release/noetica-0.1.0-node.tar.gz
          test -f dist/release/noetica-0.1.0-node.tar.gz.sha256
          test -f dist/release/noetica-0.1.0-node.tar.gz.receipt.json
