name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: CLI doctor
        run: npm run cli:doctor
      - name: CLI smoke
        run: npm run cli:smoke
      - name: Tauri icon materializer
        run: |
          npm run tauri:icon
          node -e "const fs=require('fs'); const b=fs.readFileSync('src-tauri/icons/icon.png'); const sig='89504e470d0a1a0a'; if (b.subarray(0,8).toString('hex') !== sig) { throw new Error('src-tauri/icons/icon.png is not a PNG'); }"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  tauri-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Tauri build feasibility
        run: npm run tauri:build
