name: ci

on:
  push:
  pull_request:

# Least-privilege default for every job (checkout + build + test only need read).
permissions:
  contents: read

jobs:
  app:
    name: app static build
    runs-on: ubuntu-latest
    # A job-level cap is a BACKSTOP, not a red verdict: when a job exceeds
    # `timeout-minutes` Actions concludes it `cancelled`, which is exactly the
    # neither-green-nor-red non-verdict this PR exists to remove. Measured here —
    # run 30461822497 hit the 360-minute default and reported conclusion=cancelled.
    # So this only bounds the SPEND; the red comes from the step-level `timeout`
    # wrappers below, which exit 124 and fail the step for real.
    timeout-minutes: 20
    env:
      HUSKY: 0
      NOETICA_STATIC_EXPORT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # agent-machine deps (mammoth, unpdf, fflate) are needed here because the
          # root `typecheck` script chains `npm --prefix agent-machine run typecheck`.
          # Without this the chained typecheck resolves those imports against the root
          # node_modules, where they are absent, and fails with TS2307.
          npm --prefix agent-machine ci

      # Same reasoning as the agent-machine suite: a wedged build must exit 124 (a FAILED
      # step) rather than sit until the job cap, where the conclusion is `cancelled` and
      # this required check reports no verdict at all. These steps take ~1-2 minutes, so
      # 15m is pure headroom and only ever fires on a genuine hang.
      - name: Typecheck
        run: timeout --verbose --kill-after=30s 15m npm run typecheck

      - name: Static build
        run: timeout --verbose --kill-after=30s 15m npm run build:static

      - name: Static export probe
        run: timeout --verbose --kill-after=30s 15m npm run build:static:probe

  agent-machine:
    name: agent-machine build and test
    runs-on: ubuntu-latest
    # See the `app` job — a backstop on spend only. `cancelled` is not a verdict; the
    # step-level `timeout` on the suite below is what turns a hang into a RED check.
    timeout-minutes: 25
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-machine/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-machine dependencies
        working-directory: agent-machine
        run: npm ci

      - name: Build agent-machine
        working-directory: agent-machine
        run: npm run build

      # `timeout` (coreutils) makes a wedged suite exit 124 — a FAILED step — rather than
      # sitting until the job limit, where the conclusion is "cancelled" and the required
      # check reports no verdict at all. The suite runs in well under a minute; 15m is pure
      # headroom, so this only ever fires on a genuine hang. `--verbose` makes the kill
      # say so on stderr, so a 124 is never mistaken for an ordinary test failure.
      - name: Test agent-machine
        working-directory: agent-machine
        run: timeout --verbose --kill-after=30s 15m npm test

      # The verified-operator library is the ground truth the compute lane trusts blindly; a wrong
      # operator = confident wrong answers (the moat inverts). Guard it in CI — point tests + property
      # invariants. Previously the self-test only ran manually, so an edit could break an operator silently.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verified operators
        working-directory: agent-machine
        run: |
          python -m pip install --quiet sympy pytest
          python -m pytest lib/test_math_operators.py -q
