name: ci

on:
  push:
  pull_request:

# Least-privilege default for every job (checkout + build + test only need read).
permissions:
  contents: read

jobs:
  app:
    name: app static build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NOETICA_STATIC_EXPORT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # agent-machine deps (mammoth, unpdf, fflate) are needed here because the
          # root `typecheck` script chains `npm --prefix agent-machine run typecheck`.
          # Without this the chained typecheck resolves those imports against the root
          # node_modules, where they are absent, and fails with TS2307.
          npm --prefix agent-machine ci

      - name: Typecheck
        run: npm run typecheck

      # The top-level lib/**/*.test.ts files were executed by NO job. Root `npm test` is
      # `cd agent-machine && npm test`, and #589's `test:app` is scoped to app/ — so 58
      # assertions across 11 files, covering the autonomy ladder, the spend ceiling, the
      # egress audit, the A2A grant check and the chat secret scanner, were being written,
      # reviewed and merged without ever running. A test that nothing executes is a comment.
      #
      # A step in an already-required job rather than a job of its own, on purpose: branch
      # protection pins required contexts by NAME ("app static build", "agent-machine build
      # and test"), so a new job would report but could not block until someone edited
      # protection — declared-unenforced, which is the shape of defect this step exists to
      # end. Placed before the static build so a logic failure reports in seconds rather
      # than after the Next.js compile.
      - name: Unit tests (lib/ — governance, chat, a2a, security)
        run: npm run test:lib

      - name: Static build
        run: npm run build:static

      - name: Static export probe
        run: npm run build:static:probe

  agent-machine:
    name: agent-machine build and test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-machine/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-machine dependencies
        working-directory: agent-machine
        run: npm ci

      - name: Build agent-machine
        working-directory: agent-machine
        run: npm run build

      - name: Test agent-machine
        working-directory: agent-machine
        run: npm test

      # The verified-operator library is the ground truth the compute lane trusts blindly; a wrong
      # operator = confident wrong answers (the moat inverts). Guard it in CI — point tests + property
      # invariants. Previously the self-test only ran manually, so an edit could break an operator silently.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verified operators
        working-directory: agent-machine
        run: |
          python -m pip install --quiet sympy pytest
          python -m pytest lib/test_math_operators.py -q
